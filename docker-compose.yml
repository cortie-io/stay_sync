# 운영 위치: beta (172.26.4.90). 소스와 빌드는 alpha에서, 배포는 alpha에서 `deploy stay-sync-kbu`.
# 포트는 127.0.0.1과 beta 사설 IP에만 연다 — 외부 요청은 gate만 들어온다.
name: stay-sync-kbu
services:
  kbu-stay-sync-backend:
    build: ./backend
    image: cortie/kbu-stay-sync-backend:latest
    env_file: ./backend/.env.docker
    environment:
      NODE_ENV: production # 오류 화면에 코드 위치(스택)를 내보내지 않는다
      CORS_ORIGINS: https://kbu.stay-sync.cortie.io
      SITE_ID: kbu-stay-sync # ChatLog·RouteLog의 출처 사이트
      OSRM_URL: http://osrm:5000
      ROUTE_SERVER_AUTO_START: "false" # 예전 osmnx 경로 서버는 OSRM으로 대체
      STORY_LLM_TIMEOUT_MS: "12000" # 여행 이야기 AI 응답 대기(늦으면 대체 문장). 5초는 가끔 모자랐다
    ports:
      - "127.0.0.1:4510:4500"
      - "172.26.4.90:4510:4500"
    networks:
      - default
      - osrm
    restart: unless-stopped
  kbu-stay-sync-frontend:
    build: ./frontend
    image: cortie/kbu-stay-sync-frontend:latest
    environment:
      API_INTERNAL_URL: http://kbu-stay-sync-backend:4500 # 서버 렌더링은 공개 주소로 돌아가지 않고 내부망으로 직접
    ports:
      - "127.0.0.1:5183:5173"
      - "172.26.4.90:5183:5173"
    restart: unless-stopped
networks:
  osrm:
    name: cortie-osrm
    external: true # osrm 제품이 만든다 (먼저 띄울 것)
