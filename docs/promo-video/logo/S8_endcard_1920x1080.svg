<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- S8 엔드카드. 폰트: Noto Serif KR / Noto Sans KR 설치 필요(Google Fonts).
       AE 연출: #wave 에 Trim Paths 0→100% → #dot Scale 0→100(Overshoot) → 텍스트 순차 페이드인 -->
  <rect id="bg" width="1920" height="1080" fill="#ffffff"/>
  <g id="logo" transform="translate(900 300) scale(3.75)">
    <circle id="ring" cx="16" cy="16" r="14.5" fill="none" stroke="#34322f" stroke-width="1.2"/>
    <path id="wave" d="M8.5 20.5c3-.5 4.5-8.5 7.5-8.5s3 5.5 6.5 4.5" fill="none" stroke="#34322f" stroke-width="1.4" stroke-linecap="round"/>
    <circle id="dot" cx="22.8" cy="16.3" r="1.8" fill="#4e6e61"/>
  </g>
  <text id="wordmark" x="972" y="540" text-anchor="middle" font-family="'Noto Serif KR', serif" font-size="60" letter-spacing="24" fill="#34322f">STAY-SYNC</text>
  <text id="slogan" x="960" y="630" text-anchor="middle" font-family="'Noto Serif KR', serif" font-size="42" fill="#34322f">검색은 줄이고, 여행은 더 깊게</text>
  <line id="divider" x1="910" y1="680" x2="1010" y2="680" stroke="#4e6e61" stroke-width="2"/>
  <text id="url" x="960" y="740" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="28" letter-spacing="3" fill="#7a7874">kbu.stay-sync.cortie.io</text>
</svg>
